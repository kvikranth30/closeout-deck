<svg width="1875" height="984" viewBox="0 0 1875 984" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(34, 197, 94, 0.04)" stroke-width="1"/>
    </pattern>
    <!-- Glow filters -->
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="80" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="60" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <!-- Radial gradient for corner glows -->
    <radialGradient id="glowGradient1" cx="0%" cy="0%" r="60%">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGradient2" cx="100%" cy="100%" r="60%">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGradient3" cx="80%" cy="20%" r="40%">
        <stop offset="0%" stop-color="#4ade80" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
</defs>

<!-- Base background -->
<rect width="1875" height="984" fill="#0A0A0B"/>

<!-- Grid overlay -->
<rect width="1875" height="984" fill="url(#grid)"/>

<!-- Ambient glow orbs -->
<rect width="1875" height="984" fill="url(#glowGradient1)"/>
<rect width="1875" height="984" fill="url(#glowGradient2)"/>
<rect width="1875" height="984" fill="url(#glowGradient3)"/>

